title: Ozan E. Akbas
url: "https://ozaneakbas.com"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-sitemap

sass:
  sass_dir: _sass
  style: compressed

# Keep the output clean
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - vendor
  - .jekyll-cache
  - _site
  - _tmp_build
  - .DS_Store